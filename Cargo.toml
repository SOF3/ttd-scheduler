[package]
name = "ttd-scheduler"
version = "0.1.0"
edition = "2024"
default-run = "ttd-scheduler"

[[bin]]
name = "web"

[dependencies]
anyhow = "1.0.104"
arrayvec = { version = "0.7.8", features = ["serde"] }
clap = { version = "4.6.7", features = ["derive"] }
derive_more = { version = "2.1.1", features = ["add", "add_assign"] }
eframe = { version = "0.37.0", optional = true }
egui = { version = "0.37.0", optional = true }
either = "1.19.0"
env_logger = "0.11.12"
futures = "0.3.34"
indexmap = { version = "2.14.2", features = ["serde"] }
itertools = "0.15.0"
log = "0.4.35"
num-traits = "0.2.19"
ordered-float = "5.5.1"
rfd = { version = "0.18.0", optional = true }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen-futures = "0.4.80"
web-sys = { version = "0.3.107", features = ["Document", "HtmlCanvasElement", "Storage", "Window"] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
dirs = { version = "7.0.0", optional = true }
smol = "2.0.2"

[features]
default = ["gui"]
gui = ["dep:egui", "dep:eframe", "dep:rfd", "dep:dirs"]
render-fps = []
